name: Container image

# Publishes ghcr.io/libreble/<repo> (linux/amd64 + linux/arm64) with the built-in
# GITHUB_TOKEN — no registry account or secrets. Releases only: a v* tag pushes
# <version>, <major>.<minor> and latest. Pull requests build and smoke-test only.
on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build for the runner, run it, and check the page, assets, SW, manifest and SPA fallback.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smoke:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run -d --name smoke -p 8080:8080 smoke:test
      - run: ./docker/smoke.sh http://localhost:8080/
      - if: failure()
        run: docker logs smoke

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
